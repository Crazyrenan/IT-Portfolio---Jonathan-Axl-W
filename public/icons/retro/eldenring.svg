<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Elden Ring Great Rune Golden Intersecting Rings Icon -->
  <rect x="2" y="2" width="28" height="28" fill="#0D0907" stroke="#000000" stroke-width="2"/>
  <!-- Dark Gold Ring Frame -->
  <rect x="4" y="4" width="24" height="24" fill="none" stroke="#684A1C" stroke-width="1"/>
  <!-- Top Center Arc -->
  <path d="M 8 12 A 8 8 0 0 1 24 12" fill="none" stroke="#E5B94F" stroke-width="2"/>
  <!-- Central Intersecting Rings -->
  <circle cx="16" cy="14" r="5" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <circle cx="11" cy="18" r="4.5" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="21" cy="18" r="4.5" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Central Vertical Spear / Rune line -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="#FFF0A0" stroke-width="1.5"/>
  <line x1="10" y1="26" x2="22" y2="26" stroke="#D4AF37" stroke-width="2"/>
  <!-- Lower intersecting arc -->
  <path d="M 10 21 A 6 6 0 0 0 22 21" fill="none" stroke="#E5B94F" stroke-width="1.5"/>
</svg>
